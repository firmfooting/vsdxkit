name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test py${{ matrix.python-version }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          # macOS runs the floor and ceiling interpreters only. What a third
          # platform adds is filesystem behaviour (path separators, a
          # case-insensitive default filesystem), which does not vary by
          # interpreter minor version, so a full third column would spend five
          # jobs a run testing the same thing five times.
          - os: macos-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.14'
          # Coverage is measured on one cell, the interpreter the lint, docs
          # and build jobs already use. Measuring it on all twelve would
          # produce the same number twelve times.
          - os: ubuntu-latest
            python-version: '3.12'
            coverage: true
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false
          version: "0.12.7"
      - name: Install
        if: ${{ !matrix.coverage }}
        run: uv sync --locked --no-default-groups --group test
      - name: Test
        if: ${{ !matrix.coverage }}
        run: uv run --no-sync python -m pytest tests -q
      - name: Install with coverage
        if: ${{ matrix.coverage }}
        run: uv sync --locked --no-default-groups --group test --group coverage
      - name: Test with coverage
        # fail_under lives in pyproject.toml; pytest-cov applies it here and
        # fails the job when coverage drops below it.
        id: coverage
        if: ${{ matrix.coverage }}
        run: uv run --no-sync python -m pytest tests --cov=vsdx --cov-report=xml --cov-report=term
      # Both steps below run whether the step above passed or failed, so a run
      # under the threshold still shows which files lost coverage. They are
      # skipped when it was skipped, because then the install failed and there
      # is no report to read. --fail-under=0 keeps the gate in one place rather
      # than failing the job twice for one cause.
      - name: Publish coverage summary
        if: ${{ matrix.coverage && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
        run: |
          {
            echo '## Coverage'
            echo
            uv run --no-sync coverage report --format=markdown --fail-under=0
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: ${{ matrix.coverage && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  minimum-dependencies:
    name: lowest direct dependencies py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false
          version: "0.12.7"
      - name: Resolve declared dependency floors
        run: uv lock --upgrade --resolution lowest-direct
      - name: Install test environment
        run: uv sync --frozen --no-default-groups --group test
      - name: Show resolved versions
        run: uv pip list --python .venv
      - name: Test
        run: uv run --no-sync python -m pytest tests -q

  libreoffice-interop:
    # libvisio (LibreOffice's Visio importer) is stricter about namespace
    # prefixes than Visio is, so converting a package this library wrote is the
    # end-to-end check that its parts are still readable elsewhere.
    name: LibreOffice import
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false
          version: "0.12.7"
      - name: Install LibreOffice Draw
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libreoffice-draw
      - name: Install
        run: uv sync --locked --no-default-groups --group test
      - name: Convert library output to PDF
        run: uv run --no-sync python -m pytest tests/test_interop_libreoffice.py -q

  lint:
    name: ruff + pyrefly
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false
          version: "0.12.7"
      - name: Install lint and documentation tools
        run: uv sync --locked --no-default-groups --group lint --group docs
      - name: ruff check
        run: uv run --no-sync ruff check vsdx tests tools
      - name: ruff format
        run: uv run --no-sync ruff format --check vsdx tests tools
      - name: pyrefly strict
        run: uv run --no-sync pyrefly check vsdx --min-severity warn --output-format min-text
      - name: Verify action pin annotations
        run: uv run --no-sync python tools/check_action_pins.py
      - name: Public type-completeness gate
        run: uv run --no-sync python tools/check_public_annotations.py
      - name: Mypy consumer fixture
        run: uv run --no-sync mypy --disallow-untyped-calls --follow-imports=silent --ignore-missing-imports tests/type_fixture.py
      - name: Sphinx documentation
        run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html

  build:
    name: build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false
          version: "0.12.7"
      - name: Build
        run: |
          # the test group is here for the sdist smoke test, which runs the
          # packaged suite out of the unpacked archive
          uv sync --locked --no-default-groups --group build --group test
          uv run --no-sync python -m build
      - name: Smoke test the wheel
        run: |
          uv venv dist-check
          uv pip install --python dist-check/bin/python dist/*.whl
          uv pip show --python dist-check/bin/python vsdxkit >/dev/null
          # run from outside the checkout so the source tree cannot shadow the wheel
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/dist-check/bin/python" "$GITHUB_WORKSPACE/tools/smoke_wheel.py" "$GITHUB_WORKSPACE"/dist/*.whl
      - name: Smoke test the sdist
        run: uv run --no-sync python tools/smoke_sdist.py dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
