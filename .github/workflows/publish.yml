# Release management and PyPI publication in one workflow. The filename is
# load-bearing: the PyPI trusted publisher for vsdxkit is bound to THIS file
# (publish.yml) and the `pypi` environment, so the publish job must live here
# and the environment name must match exactly. Renaming this file breaks
# publishing with an error that reads like a permissions problem.
#
# Flow: conventional commits land on main -> release-please maintains a release
# PR (version bump + CHANGELOG) -> merging it makes release-please, in that same
# push's run, create the vX.Y.Z tag and GitHub release and set
# release_created=true -> the build and publish jobs run in the SAME run.
#
# release-please authenticates as the firmfooting-bot GitHub App (org secrets
# RELEASE_APP_CLIENT_ID / RELEASE_APP_PRIVATE_KEY, visibility: all) rather than
# as GITHUB_TOKEN. A pull request opened with the default token triggers no
# workflows, so a release PR would report no checks at all and sit blocked
# against any required ones with nothing able to clear them -- dbml-sharepoint's
# 0.5.0 waited eight days that way. An installation token is a real actor, so
# ci.yml and zizmor.yml run on the release PR like any other.
#
# The version lives ONCE, in vsdx/__init__.py, marked with the
# x-release-please-version annotation. pyproject.toml reads it via
# tool.setuptools.dynamic; a static [project].version would stale uv.lock on
# every bump and fail the `uv sync --locked` gate on the merge commit.
#
# There is no TestPyPI path: publishing goes straight to PyPI by decision. A
# manual dispatch therefore publishes for real, so it is fenced -- it runs only
# from main, and only for a version that is already tagged. It exists for the
# first-release bootstrap and as the recovery route below.
#
# RECOVERY. release_created is true only on the run that creates the release. If
# build or publish fails after that, "Re-run all jobs" runs release-please
# again, it finds the release already made, reports release_created=false, and
# the run goes green having published nothing. Re-run *failed* jobs works
# because successful outputs are reused, but do not rely on the distinction:
# fix forward and use a manual dispatch, which republishes the tagged version
# through the same gates.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Serialise: two pushes to main in quick succession would otherwise run
# release-please twice at once and race on the release PR and the tag. Never
# cancel one part-way -- a half-finished publish is the one outcome worth
# avoiding, and PyPI takes a version exactly once.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: maintain the release PR
    runs-on: ubuntu-latest
    # Nothing is taken from GITHUB_TOKEN. The app token minted below does every
    # write, and being a different actor is the whole point.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Fail closed before release-please runs. A missing secret would otherwise
      # surface as an opaque token-exchange error inside the action, and the
      # recovery is to set the org secret either way.
      - name: Require the release app secrets
        env:
          APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APP_CLIENT_ID}" ]; then
            echo "RELEASE_APP_CLIENT_ID is not set; refusing to release." >&2
            exit 1
          fi
          if [ -z "${APP_PRIVATE_KEY}" ]; then
            echo "RELEASE_APP_PRIVATE_KEY is not set; refusing to release." >&2
            exit 1
          fi

      # Short-lived, scoped to this repository's installation, masked in the log
      # and revoked when the job ends. The two permissions are the ones this job
      # would otherwise take from GITHUB_TOKEN: the tag and release need
      # contents, the release PR and its `autorelease:` label need pull-requests.
      - name: Mint an installation token for this repository
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: build and verify
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          fetch-depth: 0  # tags, so a manual run can prove its version was released
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false  # release artifacts are never built from a cache
          version: "0.12.7"
      - name: Verify the version, its tag and its changelog agree
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="$(uv run --no-project python tools/check_version_tag.py --print-version)"
          tag="${RELEASE_TAG:-}"
          if [ -z "$tag" ]; then
            # A manual run carries no tag from release-please. Require one to
            # exist for the packaged version, so a dispatch can only republish
            # something already released -- never whatever happens to be on main.
            tag="v${version}"
            git fetch --tags --quiet
            if ! git rev-parse -q --verify "refs/tags/${tag}^{commit}" >/dev/null; then
              echo "no ${tag} tag exists; a manual publish may only target a tagged version" >&2
              exit 1
            fi
          fi
          # Unconditional, both paths: release-please rewrites vsdx/__init__.py
          # through the extra-files entry in release-please-config.json, and if
          # that entry stops matching, the tag and the package disagree
          # silently. PyPI takes a version once, so check rather than trust.
          uv run --no-project python tools/check_version_tag.py "$tag"
          # --since: release-please writes the changelog section and has been
          # observed to drop a commit. Two `fix!` subjects went missing from the
          # 0.8.0 section, both breaking public API changes, and only a manual
          # reconciliation caught them. Compare the section against the history
          # it claims to describe.
          git fetch --tags --quiet --unshallow 2>/dev/null || git fetch --tags --quiet
          previous="$(git tag --list 'v*' --sort=-version:refname | grep -Fxv "$tag" | head -1)"
          if [ -n "$previous" ]; then
            uv run --no-project python tools/release_check.py "$version" --since "$previous"
          else
            echo "no earlier v* tag; checking the section exists but not its completeness"
            uv run --no-project python tools/release_check.py "$version"
          fi

      # main is not branch-protected, so a green CI run on the release PR is a
      # convention rather than a gate. Publishing is irreversible; re-run the
      # gates here rather than rest on the convention.
      - name: Install
        run: uv sync --locked --no-default-groups --group test --group lint
      - name: Test
        run: uv run --no-sync python -m pytest tests -q
      - name: Lint and type check
        run: |
          uv run --no-sync ruff check vsdx tests tools
          uv run --no-sync ruff format --check vsdx tests tools
          uv run --no-sync pyrefly check vsdx --min-severity warn --output-format min-text
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke test the wheel
        run: |
          uv venv dist-check
          uv pip install --python dist-check/bin/python dist/*.whl
          # run from outside the checkout so the source tree cannot shadow the wheel
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/dist-check/bin/python" "$GITHUB_WORKSPACE/tools/smoke_wheel.py" "$GITHUB_WORKSPACE"/dist/*.whl
      # The sdist goes to PyPI beside the wheel and is what a downstream
      # packager builds from. This checks it carries every tracked test file
      # and that the suite passes from the unpacked archive, so a release
      # cannot ship a tests/ directory that nobody downstream can run.
      - name: Smoke test the sdist
        run: uv run --no-sync python tools/smoke_sdist.py dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vsdxkit/
    permissions:
      id-token: write  # OIDC trusted publishing; no API token anywhere
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          attestations: true
          print-hash: true

  attach:
    # release-please creates the GitHub release at the top of the run, before
    # anything is built, so it carries no assets. Put them back once PyPI has
    # accepted the upload, which is also the point at which the release is
    # truthful: until then it announces a version that is on no index.
    name: attach the distribution to the release
    needs: [release-please, build, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # upload assets to the release release-please created
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Upload the sdist and wheel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
