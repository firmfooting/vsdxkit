name: zizmor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# Same shape as ci.yml: a push that supersedes an in-flight audit of the same
# ref makes the older run's verdict stale, and this workflow gates nothing that
# a cancellation could leave half-done.
concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit GitHub Actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false
          version: "0.12.7"
      - name: Install lint tools
        run: uv sync --locked --no-default-groups --group lint
      - name: Run zizmor
        run: uv run --no-sync zizmor .github/workflows
